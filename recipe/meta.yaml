{% set python_min = "3.10" %}
{% set name = "txl-local-kernels" %}
{% set version = "0.3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/txl_local_kernels-{{ version }}.tar.gz
  sha256: 193eaed7111c302ed7704c69f79700125df8ebf1bc8e7c914bc378a056f15ff9

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2
    - txl-kernel >=0.3.6
    - pyzmq >=24.0.1
    - ipykernel

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_local_kernels

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/local_kernels
  summary: TXL plugin for local kernels
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/local_kernels
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
